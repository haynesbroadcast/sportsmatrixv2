name: SportsMatrix tests

on:
  push:
    branches: [main, "release/**"]
  pull_request:

jobs:
  python-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Install fonts used by renderers
        run: sudo apt-get update && sudo apt-get install -y fonts-liberation fonts-dejavu-core
      - name: Install application dependencies
        run: python -m pip install -r requirements.txt
      - name: Compile Python source
        run: python -m compileall -q sportsmatrix render tests
      - name: Check Control Room JavaScript syntax
        run: |
          python - <<'PY'
          from pathlib import Path
          import re
          html = Path("sportsmatrix/templates/control.html").read_text()
          scripts = re.findall(r"<script[^>]*>(.*?)</script>", html, flags=re.S | re.I)
          assert scripts, "Control Room has no inline script"
          Path("/tmp/sportsmatrix-control.js").write_text("\n".join(scripts))
          PY
          node --check /tmp/sportsmatrix-control.js
      - name: Run unit tests (no Pi hardware required)
        run: python -m unittest discover -s tests -v
